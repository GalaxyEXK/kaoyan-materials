name: Extract documents to Markdown

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - "**/*.docx"
      - "**/*.pdf"
      - "scripts/extract_to_md.py"
      - ".github/workflows/extract-to-md.yml"

  push:
    branches:
      - main
    paths:
      - "**/*.docx"
      - "**/*.pdf"
      - "scripts/extract_to_md.py"
      - ".github/workflows/extract-to-md.yml"

permissions:
  contents: write

concurrency:
  group: extract-to-md-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install converters
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-chi-sim \
            tesseract-ocr-eng \
            unzip

      - name: Convert documents
        run: |
          python3 scripts/extract_to_md.py

      - name: Check generated files
        run: |
          git status --short

      - name: Commit generated Markdown
        if: github.event_name != 'pull_request'
        run: |
          git add --all _extracted

          if git diff --cached --quiet; then
            echo "No new Markdown files."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Auto extract documents to Markdown"
          git push
