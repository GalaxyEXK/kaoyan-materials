name: Extract documents to Markdown

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - "**/*.docx"
      - "**/*.pdf"
      - "scripts/extract_to_md.py"
      - ".github/workflows/extract-to-md.yml"

  push:
    branches:
      - main
    paths:
      - "**/*.docx"
      - "**/*.pdf"
      - "scripts/extract_to_md.py"
      - ".github/workflows/extract-to-md.yml"

permissions:
  contents: write

concurrency:
  group: extract-to-md-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight fallback tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils
          python -m pip install --upgrade pip
          pip install requests

      - name: Convert documents
        env:
          PYTHONUNBUFFERED: "1"
          MINERU_API_TOKEN: ${{ secrets.MINERU_API_TOKEN }}
          MINERU_BATCH_SIZE: "10"
          MINERU_TIMEOUT_SECONDS: "3600"
          MINERU_MAX_FILES: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: |
          python3 scripts/extract_to_md.py

      - name: Check generated files
        run: |
          python -m py_compile scripts/extract_to_md.py
          git status --short

      - name: Commit generated Markdown
        if: github.event_name != 'pull_request'
        run: |
          git add --all _extracted GPT_INDEX.md

          if git diff --cached --quiet; then
            echo "No new Markdown files."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Auto extract documents to Markdown"
          git push
