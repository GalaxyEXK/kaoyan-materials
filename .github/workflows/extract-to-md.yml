name: Extract documents to Markdown

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "**/*.docx"
      - "**/*.pdf"
      - "scripts/extract_to_md.py"
      - ".github/workflows/extract-to-md.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install converters
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils

      - name: Convert documents
        run: |
          python3 scripts/extract_to_md.py

      - name: Check generated files
        run: |
          git status --short

      - name: Commit generated Markdown
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No new Markdown files."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add _extracted
          git commit -m "Auto extract documents to Markdown"
          git push
